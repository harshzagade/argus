- id: ARG-1025
  name: Systemd timer persistence created
  description: A new .timer unit file appeared in /etc/systemd/system. Systemd timers are the modern cron equivalent and a stealthy persistence mechanism for recurring malicious execution that many monitoring setups miss.
  severity: high
  mitre: [T1053.006]
  compliance:
    pci_dss: ["11.5.1"]
    gdpr: ["Art.32"]
    nist_800_53: ["SI-7", "CM-6"]
  source: fim
  match:
    all:
      - {field: "event.path", regex: '^/etc/systemd/system/.*\.timer$'}
      - {field: "event.action", equals: "created"}
  entities: ["event.path", "event.user"]
  title: "New systemd timer installed on {agent_id}: {event.path}"
  playbook: snapshot-evidence
  ai_triage: true
