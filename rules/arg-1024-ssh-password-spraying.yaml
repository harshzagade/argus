- id: ARG-1024
  name: SSH password spraying
  description: Ten or more failed SSH logins from a single source IP within ten minutes. Unlike a brute force against one account, spraying tries a few common passwords across many usernames, so per-account lockouts never trigger. Grouping by source IP catches it regardless of which usernames were tried.
  severity: high
  mitre: [T1110.003]
  compliance:
    pci_dss: ["8.3.6", "10.2.4"]
    gdpr: ["Art.32"]
    nist_800_53: ["AC-7", "SI-4"]
  source: auth
  match:
    all:
      - {field: "event.service", equals: "sshd"}
      - {field: "event.result", equals: "failed"}
  group_by: ["agent_id", "event.src_ip"]
  threshold: {count: 10, window: 600}
  cooldown: 1800
  entities: ["event.src_ip", "event.user"]
  title: "SSH password spraying from {event.src_ip} against {agent_id}"
  playbook: block-ssh-bruteforce
  ai_triage: true
