- id: ARG-1009
  name: Critical credential store modified
  description: /etc/passwd, /etc/shadow, /etc/group or /etc/gshadow was created, modified or deleted. Direct tampering with the local credential database, either for credential theft or account manipulation.
  severity: critical
  mitre: [T1003.008, T1136]
  compliance:
    pci_dss: ["11.5.1", "10.2.4"]
    gdpr: ["Art.32", "Art.33"]
    nist_800_53: ["SI-7", "AC-2"]
  source: fim
  match:
    all:
      - {field: "event.path", regex: '^/etc/(passwd|shadow|gshadow|group)$'}
      - {field: "event.action", in: ["created", "modified", "deleted"]}
  entities: ["event.path", "event.user"]
  title: "Credential store changed on {agent_id}: {event.path} ({event.action})"
  playbook: snapshot-evidence
  ai_triage: true
